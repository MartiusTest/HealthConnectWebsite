<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>View Brochure</title>
  <meta name="description" content="Health Connect brochure viewer">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/content/Site.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-light bg-white border-bottom shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/index.html">
      <img src="/images/logo.png" height="36" class="me-2">
      Health Connect
    </a>
  </div>
</nav>

<main class="container py-4">

  <div class="d-flex align-items-center mb-3">
    <a href="javascript:history.back()" class="btn btn-link me-3">&larr; Back</a>
    <h3 class="mb-0 text-primary">Brochure Viewer</h3>
  </div>

  <div class="pdf-container" style="height:80vh;border:1px solid #ccc;border-radius:8px;overflow:hidden;">
    <iframe id="pdfFrame" class="w-100 h-100 border-0"></iframe>
  </div>

</main>

<footer class="footer text-white py-3" style="background-color: var(--hc-blue);">
  <div class="container d-flex justify-content-between small">
    <span>&copy; 2025 Health Connect</span>
    <span>Insurance • Home Health Care • Diagnostics</span>
  </div>
</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");

  if (file) {
    document.getElementById("pdfFrame").src = file;
  } else {
    document.querySelector(".pdf-container").innerHTML =
      "<div class='p-4 text-center text-danger'>No brochure selected.</div>";
  }
</script>

</body>
</html>
