<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Application Form</title>
  <meta name="description" content="Health Connect application form viewer">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/content/Site.css" rel="stylesheet">

  <style>
    .form-preview-card {
      border: 1px solid #dee2e6;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    .form-preview-link {
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
    }

    .form-preview-link canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #f8f9fa;
    }

    .form-preview-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      text-align: center;
    }

    .pdf-viewer {
      height: 80vh;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-light bg-white border-bottom shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/index.html">
      <img src="/images/logo_blue.png" height="36" class="me-2" alt="Health Connect">
      Health Connect
    </a>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex align-items-center mb-3">
    <a href="javascript:history.back()" class="btn btn-link me-3">&larr; Back</a>
    <div>
      <h3 class="mb-1 text-primary">Application Forms</h3>
      <p class="mb-0 text-muted" id="planSubtitle">Select a plan to view available application forms.</p>
    </div>
  </div>

  <div id="formsContent"></div>
</main>

<footer class="footer text-white py-3" style="background-color: var(--hc-blue);">
  <div class="container d-flex justify-content-between small">
    <span>&copy; 2025 Health Connect</span>
    <span>Insurance • Home Health Care • Diagnostics</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
        crossorigin="anonymous"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const provider = params.get("provider") || "PacificCross";
  const plan = params.get("plan") || "";

  const planSubtitle = document.getElementById("planSubtitle");
  if (plan) {
    planSubtitle.textContent = `${provider} – ${plan}`;
  } else if (provider) {
    planSubtitle.textContent = `${provider} Application Forms`;
  }

  const planFolderOverrides = {
    PacificCross: {
      "Blue Royal": "blue_royale",
      "Blue Royale": "blue_royale",
      "Select": "select",
      "FlexiShield": "flexi_shield",
      "Critical Cover Extra": "critical_cover_extra",
      "CriticalCoverExtra": "critical_cover_extra"
    }
  };

  const slugify = (value) => value
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "");

  const providerSlug = slugify(provider);
  const planFolder = planFolderOverrides[provider]?.[plan] || (plan ? slugify(plan) : "");
  const folderPath = planFolder
    ? `pdf/application_forms/${providerSlug}/${planFolder}`
    : providerSlug
      ? `pdf/application_forms/${providerSlug}`
      : "";

  const formsContent = document.getElementById("formsContent");

  const showMessage = (message) => {
    formsContent.innerHTML = `<div class="alert alert-info">${message}</div>`;
  };

  const renderSinglePdf = (pdfUrl) => {
    formsContent.innerHTML = `
      <div class="pdf-viewer">
        <iframe class="w-100 h-100 border-0" src="${pdfUrl}" title="Application form"></iframe>
      </div>
    `;
  };

  const renderPdfList = (files) => {
    const rows = files.map((file) => {
      const filename = file.split("/").pop();
      return `
        <div class="col-md-6 col-lg-4">
          <div class="form-preview-card h-100">
            <a class="form-preview-link" href="${file}" download>
              <canvas class="pdf-preview" data-pdf="${file}" aria-label="${filename} preview"></canvas>
              <div class="form-preview-caption">${filename} Download</div>
            </a>
          </div>
        </div>
      `;
    }).join("");

    formsContent.innerHTML = `<div class="row g-4">${rows}</div>`;

    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      document.querySelectorAll(".pdf-preview").forEach((canvas) => {
        const pdfUrl = canvas.dataset.pdf;
        window.pdfjsLib.getDocument(pdfUrl).promise
          .then((pdf) => pdf.getPage(1))
          .then((page) => {
            const context = canvas.getContext("2d");
            const containerWidth = canvas.parentElement.clientWidth || 320;
            const viewport = page.getViewport({ scale: 1 });
            const scale = containerWidth / viewport.width;
            const scaledViewport = page.getViewport({ scale });

            canvas.width = scaledViewport.width;
            canvas.height = scaledViewport.height;

            return page.render({ canvasContext: context, viewport: scaledViewport }).promise;
          })
          .catch(() => {
            canvas.outerHTML = "<div class=\"text-muted p-3\">Preview unavailable.</div>";
          });
      });
    }
  };

  const fetchFolderFiles = async () => {
    if (!folderPath) {
      showMessage("Select a plan to view application forms.");
      return;
    }

    try {
      const response = await fetch(`/${folderPath}/`, { cache: "no-cache" });
      if (!response.ok) {
        throw new Error("Directory fetch failed");
      }
      const html = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");
      const links = Array.from(doc.querySelectorAll("a"));

      const files = Array.from(new Set(
        links
          .map((link) => link.getAttribute("href"))
          .filter((href) => href && href.toLowerCase().endsWith(".pdf"))
          .map((href) => new URL(href, `${window.location.origin}/${folderPath}/`).pathname)
          .map((path) => path.startsWith("/") ? path.slice(1) : path)
      ));

      if (!files.length) {
        showMessage("No application forms are available for this plan yet.");
        return;
      }

      if (files.length === 1) {
        renderSinglePdf(`/${files[0]}`);
        return;
      }

      renderPdfList(files.map((file) => `/${file}`));
    } catch (error) {
      showMessage("Unable to load application forms at the moment.");
    }
  };

  fetchFolderFiles();
</script>
</body>
</html>
